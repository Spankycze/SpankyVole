name: Export V12.2 Source
on:
  push:
    branches: [ spankyho-optimizer-v12-winui3 ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild source zip
        shell: pwsh
        run: |
          $parts = Get-ChildItem buildsrc/chunk*.txt | Sort-Object Name
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('source.zip',[Convert]::FromBase64String($b64))
      - uses: actions/upload-artifact@v4
        with:
          name: SpankyhoOptimizer_V12_2_Source
          path: source.zip
          compression-level: 0
