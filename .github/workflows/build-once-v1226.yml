name: One-shot Spankyho Optimizer V12.2.6

on:
  push:
    branches: [ spankyho-optimizer-v12-winui3 ]
    paths: [ '.github/workflows/build-once-v1226.yml' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild source
        shell: pwsh
        run: |
          $parts=Get-ChildItem buildsrc/chunk*.txt | Sort-Object Name
          if($parts.Count -ne 9){throw "Expected 9 source chunks"}
          $b64=($parts|ForEach-Object{(Get-Content $_.FullName -Raw).Trim()}) -join ''
          [IO.File]::WriteAllBytes('source.zip',[Convert]::FromBase64String($b64))
          Expand-Archive source.zip . -Force

      - name: Replace fragile MainWindow XAML with programmatic WinUI shell
        shell: pwsh
        run: |
          @'
          <Application
              x:Class="SpankyhoOptimizer.App"
              xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
              xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"
              xmlns:muxc="using:Microsoft.UI.Xaml.Controls">
              <Application.Resources>
                  <ResourceDictionary>
                      <ResourceDictionary.MergedDictionaries>
                          <muxc:XamlControlsResources />
                      </ResourceDictionary.MergedDictionaries>
                      <SolidColorBrush x:Key="SpankyAccentBrush" Color="#6366F1"/>
                      <SolidColorBrush x:Key="SpankyAccentSoftBrush" Color="#226366F1"/>
                      <SolidColorBrush x:Key="SpankySuccessBrush" Color="#16A36A"/>
                      <SolidColorBrush x:Key="SpankyWarningBrush" Color="#D9861B"/>
                      <SolidColorBrush x:Key="SpankyCardBrush" Color="#15171C"/>
                      <SolidColorBrush x:Key="SpankyCardBorderBrush" Color="#22FFFFFF"/>
                      <Style x:Key="SectionCardStyle" TargetType="Border">
                          <Setter Property="Background" Value="{StaticResource SpankyCardBrush}"/>
                          <Setter Property="BorderBrush" Value="{StaticResource SpankyCardBorderBrush}"/>
                          <Setter Property="BorderThickness" Value="1"/>
                          <Setter Property="CornerRadius" Value="12"/>
                          <Setter Property="Padding" Value="16"/>
                          <Setter Property="Margin" Value="0,0,0,10"/>
                      </Style>
                      <Style x:Key="PillButtonStyle" TargetType="Button">
                          <Setter Property="CornerRadius" Value="9"/>
                          <Setter Property="Padding" Value="14,8"/>
                          <Setter Property="MinHeight" Value="36"/>
                      </Style>
                  </ResourceDictionary>
              </Application.Resources>
          </Application>
          '@ | Set-Content src/SpankyhoOptimizer/App.xaml -Encoding utf8 -NoNewline

          @'
          <Window
              x:Class="SpankyhoOptimizer.MainWindow"
              xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
              xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml">
          </Window>
          '@ | Set-Content src/SpankyhoOptimizer/MainWindow.xaml -Encoding utf8 -NoNewline

          @'
          using Microsoft.UI;
          using Microsoft.UI.Xaml;
          using Microsoft.UI.Xaml.Controls;
          using Microsoft.UI.Xaml.Media;

          namespace SpankyhoOptimizer;

          public sealed partial class MainWindow
          {
              private Grid RootGrid = null!;
              private Grid AppTitleBar = null!;
              private NavigationView Nav = null!;
              private TextBlock PageTitle = null!;
              private TextBlock PageSubtitle = null!;
              private StackPanel SubSelectorHost = null!;
              private Grid TopActions = null!;
              private StackPanel ContentStack = null!;
              private Border ActionBar = null!;
              private TextBlock DirtyText = null!;

              private void BuildShell()
              {
                  RootGrid = new Grid();
                  RootGrid.RowDefinitions.Add(new RowDefinition { Height = new GridLength(48) });
                  RootGrid.RowDefinitions.Add(new RowDefinition { Height = new GridLength(1, GridUnitType.Star) });
                  Content = RootGrid;

                  AppTitleBar = new Grid
                  {
                      Background = new SolidColorBrush(ColorHelper.FromArgb(255, 18, 20, 25)),
                      Padding = new Thickness(16, 0, 140, 0)
                  };
                  AppTitleBar.ColumnDefinitions.Add(new ColumnDefinition { Width = GridLength.Auto });
                  AppTitleBar.ColumnDefinitions.Add(new ColumnDefinition { Width = new GridLength(1, GridUnitType.Star) });
                  AppTitleBar.ColumnDefinitions.Add(new ColumnDefinition { Width = GridLength.Auto });

                  var logo = new Border
                  {
                      Width = 28, Height = 28, CornerRadius = new CornerRadius(8),
                      Background = (Brush)Application.Current.Resources["SpankyAccentBrush"],
                      VerticalAlignment = VerticalAlignment.Center,
                      Child = new TextBlock
                      {
                          Text = "S", Foreground = new SolidColorBrush(Colors.White), FontSize = 16,
                          FontWeight = Microsoft.UI.Text.FontWeights.Bold,
                          HorizontalAlignment = HorizontalAlignment.Center, VerticalAlignment = VerticalAlignment.Center
                      }
                  };
                  AppTitleBar.Children.Add(logo);

                  var title = new StackPanel { Orientation = Orientation.Horizontal, Spacing = 8, Margin = new Thickness(10, 0, 0, 0), VerticalAlignment = VerticalAlignment.Center };
                  title.Children.Add(new TextBlock { Text = "Spankyho Optimizer", FontWeight = Microsoft.UI.Text.FontWeights.SemiBold, FontSize = 14 });
                  title.Children.Add(new TextBlock { Text = "V12.2.6", Opacity = .6, FontSize = 12, VerticalAlignment = VerticalAlignment.Center });
                  Grid.SetColumn(title, 1); AppTitleBar.Children.Add(title);

                  var admin = new Border
                  {
                      CornerRadius = new CornerRadius(8), Padding = new Thickness(10, 5, 10, 5),
                      Background = new SolidColorBrush(ColorHelper.FromArgb(255, 34, 37, 44)),
                      VerticalAlignment = VerticalAlignment.Center,
                      Child = new TextBlock { Text = "● Správce", FontSize = 11, Foreground = (Brush)Application.Current.Resources["SpankySuccessBrush"] }
                  };
                  Grid.SetColumn(admin, 2); AppTitleBar.Children.Add(admin);
                  RootGrid.Children.Add(AppTitleBar);

                  Nav = new NavigationView
                  {
                      IsBackButtonVisible = NavigationViewBackButtonVisible.Collapsed,
                      IsSettingsVisible = false,
                      PaneDisplayMode = NavigationViewPaneDisplayMode.Left,
                      OpenPaneLength = 258,
                      CompactPaneLength = 58,
                      Background = new SolidColorBrush(ColorHelper.FromArgb(255, 15, 17, 21))
                  };
                  Nav.SelectionChanged += Nav_SelectionChanged;

                  AddNav("Přehled", "overview");
                  AddNav("Systémové tweaky", "system");
                  AddNav("Power Plan", "power");
                  AddNav("GPU / Display", "gpu");
                  AddNav("Paměť & Latence", "memory");
                  AddNav("Úložiště / NVMe", "storage");
                  AddNav("Internet / Síť", "network");
                  AddNav("Prohlížeče", "browsers");
                  AddNav("Systémové komponenty", "components");
                  AddNav("UI / Explorer", "ui");
                  AddNav("Windows Update", "update");
                  AddNav("Soukromí & zabezpečení", "privacy");
                  AddNav("Defender", "defender");
                  AddNav("Debloater", "debloat");
                  AddNav("Aplikace", "apps");
                  AddNav("BIOS / SCEWIN", "bios");
                  AddNav("Fixer", "fixer");
                  AddNav("Záloha / Obnova", "restore");
                  AddNav("Monitor / Log", "logs");
                  AddNav("Nastavení", "settings");

                  var scroll = new ScrollViewer { VerticalScrollBarVisibility = ScrollBarVisibility.Auto, HorizontalScrollBarVisibility = ScrollBarVisibility.Disabled };
                  var pageHost = new Grid { Padding = new Thickness(28, 22, 30, 24), MaxWidth = 1240, HorizontalAlignment = HorizontalAlignment.Stretch };
                  pageHost.RowDefinitions.Add(new RowDefinition { Height = GridLength.Auto });
                  pageHost.RowDefinitions.Add(new RowDefinition { Height = GridLength.Auto });
                  pageHost.RowDefinitions.Add(new RowDefinition { Height = GridLength.Auto });
                  pageHost.RowDefinitions.Add(new RowDefinition { Height = GridLength.Auto });

                  var head = new Grid { Margin = new Thickness(0, 0, 0, 18) };
                  head.ColumnDefinitions.Add(new ColumnDefinition { Width = new GridLength(1, GridUnitType.Star) });
                  head.ColumnDefinitions.Add(new ColumnDefinition { Width = GridLength.Auto });
                  var leftHead = new StackPanel();
                  PageTitle = new TextBlock { Text = "Přehled", FontSize = 30, FontWeight = Microsoft.UI.Text.FontWeights.SemiBold };
                  PageSubtitle = new TextBlock { Text = "Stav systému a rychlé profily", FontSize = 14, Opacity = .68, Margin = new Thickness(0, 5, 0, 0), TextWrapping = TextWrapping.Wrap };
                  leftHead.Children.Add(PageTitle); leftHead.Children.Add(PageSubtitle); head.Children.Add(leftHead);
                  SubSelectorHost = new StackPanel { Orientation = Orientation.Horizontal, Spacing = 8, VerticalAlignment = VerticalAlignment.Bottom, Visibility = Visibility.Collapsed };
                  Grid.SetColumn(SubSelectorHost, 1); head.Children.Add(SubSelectorHost); pageHost.Children.Add(head);

                  TopActions = new Grid { Margin = new Thickness(0, 0, 0, 16) };
                  Grid.SetRow(TopActions, 1); pageHost.Children.Add(TopActions);

                  ContentStack = new StackPanel();
                  Grid.SetRow(ContentStack, 2); pageHost.Children.Add(ContentStack);

                  ActionBar = new Border
                  {
                      Visibility = Visibility.Collapsed, Margin = new Thickness(0, 14, 0, 0), Padding = new Thickness(12),
                      CornerRadius = new CornerRadius(12), Background = new SolidColorBrush(ColorHelper.FromArgb(255, 28, 30, 36)),
                      BorderBrush = new SolidColorBrush(ColorHelper.FromArgb(40, 255, 255, 255)), BorderThickness = new Thickness(1)
                  };
                  var actionGrid = new Grid(); actionGrid.ColumnDefinitions.Add(new ColumnDefinition()); actionGrid.ColumnDefinitions.Add(new ColumnDefinition { Width = GridLength.Auto });
                  DirtyText = new TextBlock { Text = "Nevyřízené změny", VerticalAlignment = VerticalAlignment.Center, FontWeight = Microsoft.UI.Text.FontWeights.SemiBold, Margin = new Thickness(4, 0, 0, 0) };
                  actionGrid.Children.Add(DirtyText);
                  var actions = new StackPanel { Orientation = Orientation.Horizontal, Spacing = 8 };
                  var discard = new Button { Content = "Zrušit změny", CornerRadius = new CornerRadius(9), Padding = new Thickness(14, 8, 14, 8) }; discard.Click += Discard_Click;
                  var apply = new Button { Content = "Použít změny", CornerRadius = new CornerRadius(9), Padding = new Thickness(14, 8, 14, 8), Background = (Brush)Application.Current.Resources["SpankyAccentBrush"], Foreground = new SolidColorBrush(Colors.White) }; apply.Click += Apply_Click;
                  actions.Children.Add(discard); actions.Children.Add(apply); Grid.SetColumn(actions, 1); actionGrid.Children.Add(actions); ActionBar.Child = actionGrid;
                  Grid.SetRow(ActionBar, 3); pageHost.Children.Add(ActionBar);

                  scroll.Content = pageHost; Nav.Content = scroll; Grid.SetRow(Nav, 1); RootGrid.Children.Add(Nav);
              }

              private void AddNav(string title, string tag)
              {
                  Nav.MenuItems.Add(new NavigationViewItem { Content = title, Tag = tag });
              }
          }
          '@ | Set-Content src/SpankyhoOptimizer/MainWindow.Shell.cs -Encoding utf8 -NoNewline

          $mc='src/SpankyhoOptimizer/MainWindow.xaml.cs'
          $c=Get-Content $mc -Raw
          $c=$c.Replace('        InitializeComponent();','        InitializeComponent();`r`n        BuildShell();')
          $c=$c.Replace('        ExtendsContentIntoTitleBar = true;`r`n        SetTitleBar(AppTitleBar);`r`n        SystemBackdrop = new MicaBackdrop { Kind = MicaKind.BaseAlt };`r`n        ConfigureWindow();','        try { ExtendsContentIntoTitleBar = true; SetTitleBar(AppTitleBar); } catch (Exception ex) { LogService.Error("Titlebar setup failed", ex); }`r`n        try { SystemBackdrop = new MicaBackdrop(); } catch (Exception ex) { LogService.Error("Backdrop setup failed", ex); }`r`n        try { ConfigureWindow(); } catch (Exception ex) { LogService.Error("Window configuration failed", ex); }')
          Set-Content $mc $c -Encoding utf8 -NoNewline

          $p='src/SpankyhoOptimizer/SpankyhoOptimizer.csproj'
          $s=Get-Content $p -Raw
          $s=$s.Replace('Version="2.4.0"','Version="1.8.260804001"')
          $s=$s.Replace('<WindowsAppSDKSelfContained>false</WindowsAppSDKSelfContained>','<WindowsAppSDKSelfContained>true</WindowsAppSDKSelfContained>')
          $s=$s.Replace('<PublishReadyToRun>true</PublishReadyToRun>','<PublishReadyToRun>false</PublishReadyToRun>')
          $s=$s.Replace('<Version>12.2.0</Version>','<Version>12.2.6</Version>')
          Set-Content $p $s -Encoding utf8 -NoNewline

      - name: Generate app icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force src/SpankyhoOptimizer/Assets|Out-Null
          $bmp=[System.Drawing.Bitmap]::new(256,256);$g=[System.Drawing.Graphics]::FromImage($bmp);$g.SmoothingMode=[System.Drawing.Drawing2D.SmoothingMode]::AntiAlias;$g.Clear([System.Drawing.Color]::Transparent)
          $b=[System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(255,99,102,241));$g.FillEllipse($b,8,8,240,240)
          $f=[System.Drawing.Font]::new('Segoe UI',132,[System.Drawing.FontStyle]::Bold,[System.Drawing.GraphicsUnit]::Pixel);$w=[System.Drawing.SolidBrush]::new([System.Drawing.Color]::White);$sf=[System.Drawing.StringFormat]::new();$sf.Alignment=[System.Drawing.StringAlignment]::Center;$sf.LineAlignment=[System.Drawing.StringAlignment]::Center;$g.DrawString('S',$f,$w,[System.Drawing.RectangleF]::new(0,0,256,248),$sf)
          $ico=[System.Drawing.Icon]::FromHandle($bmp.GetHicon());$fs=[IO.File]::Create('src/SpankyhoOptimizer/Assets/App.ico');$ico.Save($fs);$fs.Dispose();$ico.Dispose();$f.Dispose();$w.Dispose();$b.Dispose();$sf.Dispose();$g.Dispose();$bmp.Dispose()

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build self-contained WinUI app
        shell: pwsh
        run: |
          dotnet restore src/SpankyhoOptimizer/SpankyhoOptimizer.csproj -p:Platform=x64
          dotnet publish src/SpankyhoOptimizer/SpankyhoOptimizer.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -p:PublishReadyToRun=false -o artifacts/app
          if(!(Test-Path artifacts/app/SpankyhoOptimizer.exe)){throw 'Main app missing'}

      - name: Mandatory startup smoke test
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'artifacts/app/SpankyhoOptimizer.exe').Path
          $p=Start-Process $exe -PassThru -WorkingDirectory (Split-Path $exe)
          Start-Sleep -Seconds 8
          $p.Refresh()
          if($p.HasExited){
            $log=Join-Path $env:ProgramData 'SpankyhoOptimizerV12\optimizer.log'
            if(Test-Path $log){Get-Content $log -Tail 120}
            throw "Main app startup failed. ExitCode=$($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force
          Write-Host 'MAIN APP STARTUP SMOKE TEST PASSED'
          Compress-Archive -Path artifacts/app/* -DestinationPath artifacts/payload.zip -CompressionLevel Optimal -Force

      - name: Create high-contrast readable installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer/Resources|Out-Null
          Copy-Item artifacts/payload.zip installer/Resources/payload.zip
          @'
          <Project Sdk="Microsoft.NET.Sdk.WindowsDesktop">
            <PropertyGroup><OutputType>WinExe</OutputType><TargetFramework>net48</TargetFramework><UseWPF>true</UseWPF><PlatformTarget>x64</PlatformTarget><Prefer32Bit>false</Prefer32Bit><AssemblyName>Spankyho_Optimizer_V12_2_6_Setup</AssemblyName><RootNamespace>SpankyhoInstaller</RootNamespace><ApplicationManifest>app.manifest</ApplicationManifest><DebugType>none</DebugType><DebugSymbols>false</DebugSymbols></PropertyGroup>
            <ItemGroup><EmbeddedResource Include="Resources\payload.zip" LogicalName="payload.zip"/><Reference Include="System.IO.Compression"/><Reference Include="System.IO.Compression.FileSystem"/><Reference Include="Microsoft.CSharp"/></ItemGroup>
          </Project>
          '@|Set-Content installer/SpankyhoInstaller.csproj -Encoding utf8 -NoNewline
          @'
          <?xml version="1.0" encoding="utf-8"?><assembly manifestVersion="1.0" xmlns="urn:schemas-microsoft-com:asm.v1"><assemblyIdentity version="12.2.6.0" name="SpankyhoOptimizer.Setup"/><trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"/></requestedPrivileges></security></trustInfo></assembly>
          '@|Set-Content installer/app.manifest -Encoding utf8 -NoNewline
          @'
          using Microsoft.Win32;
          using System;
          using System.Diagnostics;
          using System.IO;
          using System.IO.Compression;
          using System.Linq;
          using System.Reflection;
          using System.Threading.Tasks;
          using System.Windows;
          using System.Windows.Controls;
          using System.Windows.Media;

          namespace SpankyhoInstaller
          {
              internal static class Program
              {
                  [STAThread] static int Main(string[] a)
                  {
                      if(a.Contains("--smoketest")){using(var s=Assembly.GetExecutingAssembly().GetManifestResourceStream("payload.zip"))return s==null?3:0;}
                      if(a.Contains("--uninstall"))return Uninstall();
                      var app=new Application{ShutdownMode=ShutdownMode.OnMainWindowClose}; app.Run(new InstallerWindow()); return 0;
                  }
                  static int Uninstall()
                  {
                      try
                      {
                          var d=Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.ProgramFiles),"Spankyho Optimizer");
                          try{foreach(var p in Process.GetProcessesByName("SpankyhoOptimizer"))p.Kill();}catch{}
                          try{File.Delete(Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.DesktopDirectory),"Spankyho Optimizer.lnk"));}catch{}
                          try{File.Delete(Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.CommonPrograms),"Spankyho Optimizer.lnk"));}catch{}
                          try{Registry.LocalMachine.DeleteSubKeyTree(@"SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\SpankyhoOptimizer",false);}catch{}
                          var c=Path.Combine(Path.GetTempPath(),"spankyho_remove.cmd");File.WriteAllText(c,"@echo off\r\ntimeout /t 2 /nobreak >nul\r\nrmdir /s /q \""+d+"\"\r\ndel /f /q \"%~f0\"\r\n");
                          Process.Start(new ProcessStartInfo("cmd.exe","/c \""+c+"\""){CreateNoWindow=true,UseShellExecute=false});return 0;
                      }catch{return 1;}
                  }
              }

              internal sealed class InstallerWindow:Window
              {
                  readonly SolidColorBrush Accent=new SolidColorBrush(Color.FromRgb(79,70,229));
                  readonly SolidColorBrush Main=new SolidColorBrush(Color.FromRgb(24,26,32));
                  readonly SolidColorBrush Sub=new SolidColorBrush(Color.FromRgb(76,82,94));
                  readonly ProgressBar Progress=new ProgressBar{Height=11,Minimum=0,Maximum=100,Margin=new Thickness(0,10,0,6)};
                  readonly TextBlock Status=new TextBlock{Text="Připraveno k instalaci",FontSize=16,FontWeight=FontWeights.SemiBold};
                  readonly TextBlock Percent=new TextBlock{Text="0 %",FontSize=15,FontWeight=FontWeights.SemiBold,HorizontalAlignment=HorizontalAlignment.Right};
                  readonly CheckBox Desktop=new CheckBox{Content="Vytvořit zástupce na ploše",IsChecked=true,FontSize=16,Margin=new Thickness(0,7,0,11)};
                  readonly CheckBox Launch=new CheckBox{Content="Po instalaci spustit aplikaci",IsChecked=true,FontSize=16};
                  readonly Button Install=new Button{Content="Nainstalovat",MinWidth=172,Height=50,FontSize=16,FontWeight=FontWeights.SemiBold,Foreground=Brushes.White,BorderThickness=new Thickness(0)};
                  readonly Button Cancel=new Button{Content="Zrušit",MinWidth=112,Height=50,FontSize=16,Margin=new Thickness(10,0,0,0)};
                  readonly string LogDir=Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.CommonApplicationData),"SpankyhoOptimizer");
                  string LogPath=>Path.Combine(LogDir,"setup.log");

                  public InstallerWindow()
                  {
                      Title="Spankyho Optimizer V12.2.6 Setup";Width=800;Height=620;MinWidth=720;MinHeight=570;WindowStartupLocation=WindowStartupLocation.CenterScreen;
                      Background=new SolidColorBrush(Color.FromRgb(245,246,249));Foreground=Main;FontFamily=new FontFamily("Segoe UI");
                      Install.Background=Accent;Cancel.Background=Brushes.White;Cancel.Foreground=Main;Cancel.BorderBrush=new SolidColorBrush(Color.FromRgb(198,203,213));Progress.Foreground=Accent;
                      Content=BuildUi();Install.Click+=async(_,__)=>await InstallAsync();Cancel.Click+=(_,__)=>Close();
                  }

                  UIElement BuildUi()
                  {
                      var root=new Grid{Margin=new Thickness(42,34,42,32)};root.RowDefinitions.Add(new RowDefinition{Height=GridLength.Auto});root.RowDefinitions.Add(new RowDefinition());root.RowDefinitions.Add(new RowDefinition{Height=GridLength.Auto});
                      var header=new Grid{Margin=new Thickness(0,0,0,28)};header.ColumnDefinitions.Add(new ColumnDefinition{Width=GridLength.Auto});header.ColumnDefinitions.Add(new ColumnDefinition());
                      var logo=new Border{Width=60,Height=60,CornerRadius=new CornerRadius(16),Background=Accent};logo.Child=new TextBlock{Text="S",Foreground=Brushes.White,FontWeight=FontWeights.Bold,FontSize=32,HorizontalAlignment=HorizontalAlignment.Center,VerticalAlignment=VerticalAlignment.Center};header.Children.Add(logo);
                      var titles=new StackPanel{Margin=new Thickness(18,1,0,0)};Grid.SetColumn(titles,1);titles.Children.Add(new TextBlock{Text="Instalace Spankyho Optimizer",FontSize=31,FontWeight=FontWeights.SemiBold,Foreground=Main});titles.Children.Add(new TextBlock{Text="Rychlá a přehledná instalace pro Windows 11",FontSize=16,Foreground=Sub,Margin=new Thickness(0,6,0,0)});header.Children.Add(titles);root.Children.Add(header);
                      var card=new Border{Background=Brushes.White,CornerRadius=new CornerRadius(18),BorderBrush=new SolidColorBrush(Color.FromRgb(215,219,228)),BorderThickness=new Thickness(1),Padding=new Thickness(28),Margin=new Thickness(0,0,0,24)};Grid.SetRow(card,1);var body=new StackPanel();
                      body.Children.Add(new TextBlock{Text="Umístění instalace",FontSize=15,FontWeight=FontWeights.SemiBold,Foreground=Main,Margin=new Thickness(0,0,0,9)});
                      var path=new Border{Background=new SolidColorBrush(Color.FromRgb(247,248,250)),CornerRadius=new CornerRadius(10),BorderBrush=new SolidColorBrush(Color.FromRgb(215,219,228)),BorderThickness=new Thickness(1),Padding=new Thickness(15,13,15,13),Margin=new Thickness(0,0,0,24)};path.Child=new TextBlock{Text=@"C:\Program Files\Spankyho Optimizer",FontSize=15,Foreground=Main};body.Children.Add(path);
                      body.Children.Add(new TextBlock{Text="Možnosti",FontSize=15,FontWeight=FontWeights.SemiBold,Foreground=Main,Margin=new Thickness(0,0,0,8)});body.Children.Add(Desktop);body.Children.Add(Launch);body.Children.Add(new Border{Height=1,Background=new SolidColorBrush(Color.FromRgb(229,232,238)),Margin=new Thickness(0,25,0,21)});
                      body.Children.Add(new TextBlock{Text="Stav instalace",FontSize=15,FontWeight=FontWeights.SemiBold,Foreground=Main,Margin=new Thickness(0,0,0,9)});var row=new Grid();row.ColumnDefinitions.Add(new ColumnDefinition());row.ColumnDefinitions.Add(new ColumnDefinition{Width=GridLength.Auto});row.Children.Add(Status);Grid.SetColumn(Percent,1);row.Children.Add(Percent);body.Children.Add(row);body.Children.Add(Progress);
                      body.Children.Add(new TextBlock{Text="Aplikace obsahuje .NET 10 i Windows App SDK runtime. Po instalaci se nic dalšího nestahuje.",FontSize=14,Foreground=Sub,TextWrapping=TextWrapping.Wrap,Margin=new Thickness(0,16,0,0)});card.Child=body;root.Children.Add(card);
                      var footer=new Grid();footer.ColumnDefinitions.Add(new ColumnDefinition());footer.ColumnDefinitions.Add(new ColumnDefinition{Width=GridLength.Auto});Grid.SetRow(footer,2);footer.Children.Add(new TextBlock{Text=".NET 10  •  WinUI 3  •  Windows 11 x64",FontSize=14,Foreground=Sub,VerticalAlignment=VerticalAlignment.Center});var buttons=new StackPanel{Orientation=Orientation.Horizontal};Grid.SetColumn(buttons,1);buttons.Children.Add(Install);buttons.Children.Add(Cancel);footer.Children.Add(buttons);root.Children.Add(footer);return root;
                  }

                  async Task InstallAsync()
                  {
                      Install.IsEnabled=false;Cancel.IsEnabled=false;
                      try
                      {
                          Directory.CreateDirectory(LogDir);Log("Install start");SetProgress(7,"Příprava instalačních souborů");await Task.Run(()=>InstallPayload());SetProgress(86,"Vytváření zástupců");CreateShortcuts();SetProgress(100,"Instalace dokončena");Log("Install complete");
                          if(Launch.IsChecked==true){var exe=Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.ProgramFiles),"Spankyho Optimizer","SpankyhoOptimizer.exe");Process.Start(new ProcessStartInfo(exe){UseShellExecute=true,WorkingDirectory=Path.GetDirectoryName(exe)});}
                          MessageBox.Show("Spankyho Optimizer byl úspěšně nainstalován.","Hotovo",MessageBoxButton.OK,MessageBoxImage.Information);Close();
                      }catch(Exception ex){Log("FATAL "+ex);MessageBox.Show(ex.Message+"\n\nLog: "+LogPath,"Instalace selhala",MessageBoxButton.OK,MessageBoxImage.Error);Install.IsEnabled=true;Cancel.IsEnabled=true;}
                  }
                  void SetProgress(double v,string s){Dispatcher.Invoke(()=>{Progress.Value=v;Percent.Text=((int)v)+" %";Status.Text=s;});}
                  void InstallPayload()
                  {
                      var dir=Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.ProgramFiles),"Spankyho Optimizer");try{foreach(var p in Process.GetProcessesByName("SpankyhoOptimizer"))p.Kill();}catch{}
