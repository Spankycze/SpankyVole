name: One-shot Spankyho Optimizer V12.2.8

on:
  push:
    branches: [spankyho-optimizer-v12-winui3]
    paths:
      - ".github/workflows/build-once-v1228.yml"

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild source
        shell: pwsh
        run: |
          $parts=Get-ChildItem buildsrc/chunk*.txt | Sort-Object Name
          if($parts.Count -ne 9){throw "Expected 9 source chunks"}
          $b64=($parts|ForEach-Object{(Get-Content $_.FullName -Raw).Trim()}) -join ''
          [IO.File]::WriteAllBytes('source.zip',[Convert]::FromBase64String($b64))
          Expand-Archive source.zip . -Force

      - name: Reuse code-built WinUI shell and remove MainWindow XAML
        shell: pwsh
        run: |
          $wf=Get-Content '.github/workflows/build-once-v1227.yml' -Raw
          $marker='- name: Add code-built WinUI shell'
          $sec=$wf.Substring($wf.IndexOf($marker))
          $start=$sec.IndexOf("@'")+2
          $end=$sec.IndexOf("'@ | Set-Content src/SpankyhoOptimizer/MainWindow.Shell.cs")
          if($start -lt 2 -or $end -le $start){throw 'Cannot extract WinUI shell'}
          $raw=$sec.Substring($start,$end-$start).TrimStart("`r","`n")
          $shell=(($raw -split "`r?`n")|ForEach-Object{$_ -replace '^          ',''}) -join "`r`n"
          Remove-Item src/SpankyhoOptimizer/MainWindow.xaml -Force
          Set-Content src/SpankyhoOptimizer/MainWindow.Shell.cs $shell -Encoding utf8 -NoNewline

          $mc='src/SpankyhoOptimizer/MainWindow.xaml.cs'
          $c=Get-Content $mc -Raw
          $c=$c.Replace('        InitializeComponent();','        BuildShell();')
          $c=$c.Replace('        Nav.SelectedItem = Nav.MenuItems[0];','')
          $c=$c.Replace('        SystemBackdrop = new MicaBackdrop { Kind = MicaKind.BaseAlt };','        try { SystemBackdrop = new MicaBackdrop(); } catch (Exception ex) { LogService.Error("Backdrop setup failed", ex); }')
          $c=$c.Replace('        ConfigureWindow();','        try { ConfigureWindow(); } catch (Exception ex) { LogService.Error("Window configuration failed", ex); }')
          Set-Content $mc $c -Encoding utf8 -NoNewline

          Write-Host '===== constructor after patch ====='
          Get-Content $mc | Select-Object -First 48
          if((Get-Content $mc -Raw).Contains('InitializeComponent()')){throw 'InitializeComponent still present'}
          if((Get-Content $mc -Raw).Contains('Nav.SelectedItem = Nav.MenuItems[0]')){throw 'Invalid initial selection still present'}

      - name: Patch project and generate icon
        shell: pwsh
        run: |
          $p='src/SpankyhoOptimizer/SpankyhoOptimizer.csproj'
          $s=Get-Content $p -Raw
          $s=$s.Replace('Version="2.4.0"','Version="1.8.260804001"')
          $s=$s.Replace('<WindowsAppSDKSelfContained>false</WindowsAppSDKSelfContained>','<WindowsAppSDKSelfContained>true</WindowsAppSDKSelfContained>')
          $s=$s.Replace('<PublishReadyToRun>true</PublishReadyToRun>','<PublishReadyToRun>false</PublishReadyToRun>')
          $s=$s.Replace('<Version>12.2.0</Version>','<Version>12.2.8</Version>')
          Set-Content $p $s -Encoding utf8 -NoNewline

          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force src/SpankyhoOptimizer/Assets|Out-Null
          $bmp=[System.Drawing.Bitmap]::new(256,256);$g=[System.Drawing.Graphics]::FromImage($bmp);$g.SmoothingMode=[System.Drawing.Drawing2D.SmoothingMode]::AntiAlias;$g.Clear([System.Drawing.Color]::Transparent)
          $b=[System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(255,99,102,241));$g.FillEllipse($b,8,8,240,240)
          $f=[System.Drawing.Font]::new('Segoe UI',132,[System.Drawing.FontStyle]::Bold,[System.Drawing.GraphicsUnit]::Pixel);$w=[System.Drawing.SolidBrush]::new([System.Drawing.Color]::White);$sf=[System.Drawing.StringFormat]::new();$sf.Alignment=[System.Drawing.StringAlignment]::Center;$sf.LineAlignment=[System.Drawing.StringAlignment]::Center;$g.DrawString('S',$f,$w,[System.Drawing.RectangleF]::new(0,0,256,248),$sf)
          $ico=[System.Drawing.Icon]::FromHandle($bmp.GetHicon());$fs=[IO.File]::Create('src/SpankyhoOptimizer/Assets/App.ico');$ico.Save($fs);$fs.Dispose();$ico.Dispose();$f.Dispose();$w.Dispose();$b.Dispose();$sf.Dispose();$g.Dispose();$bmp.Dispose()

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build self-contained WinUI app
        shell: pwsh
        run: |
          dotnet restore src/SpankyhoOptimizer/SpankyhoOptimizer.csproj -p:Platform=x64
          dotnet publish src/SpankyhoOptimizer/SpankyhoOptimizer.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -p:PublishReadyToRun=false -o artifacts/app
          if(!(Test-Path artifacts/app/SpankyhoOptimizer.exe)){throw 'Main app missing'}

      - name: Mandatory 15-second startup test
        shell: pwsh
        run: |
          $log=Join-Path $env:ProgramData 'SpankyhoOptimizerV12\optimizer.log'
          if(Test-Path $log){Remove-Item $log -Force}
          $exe=(Resolve-Path artifacts/app/SpankyhoOptimizer.exe).Path
          $p=Start-Process $exe -PassThru -WorkingDirectory (Split-Path $exe)
          Start-Sleep -Seconds 15
          $p.Refresh()
          if($p.HasExited){
            if(Test-Path $log){Get-Content $log -Tail 200}
            throw "Main app exited during startup test. ExitCode=$($p.ExitCode)"
          }
          if(Test-Path $log){
            $txt=Get-Content $log -Raw
            if($txt -match '\[ERR\]'){Get-Content $log -Tail 200;throw 'Startup log contains ERR'}
          }
          Stop-Process -Id $p.Id -Force
          Write-Host 'WINUI STARTUP TEST PASSED FOR 15 SECONDS.'

      - name: Pack payload
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/app/* -DestinationPath artifacts/payload.zip -CompressionLevel Optimal -Force

      - name: Extract readable installer source from V12.2.7 workflow
        shell: pwsh
        run: |
          $wf=Get-Content '.github/workflows/build-once-v1227.yml' -Raw
          $sec=$wf.Substring($wf.IndexOf('- name: Create clean readable installer'))
          function Extract-HereString([string]$target){
            $escaped=[regex]::Escape($target)
            $pattern="(?s)@'\r?\n(?<body>.*?)\r?\n\s*'@\s*\|\s*Set-Content\s+$escaped"
            $m=[regex]::Match($sec,$pattern)
            if(!$m.Success){throw "Cannot extract $target"}
            $raw=$m.Groups['body'].Value
            return ((($raw -split "`r?`n")|ForEach-Object{$_ -replace '^          ',''}) -join "`r`n")
          }
          New-Item -ItemType Directory -Force installer/Resources|Out-Null
          Copy-Item artifacts/payload.zip installer/Resources/payload.zip
          Set-Content installer/SpankyhoInstaller.csproj (Extract-HereString 'installer/SpankyhoInstaller.csproj') -Encoding utf8 -NoNewline
          Set-Content installer/app.manifest (Extract-HereString 'installer/app.manifest') -Encoding utf8 -NoNewline
          $program=Extract-HereString 'installer/Program.cs'
          $program=$program.Replace('12.2.7','12.2.8').Replace('V12.2.7','V12.2.8').Replace('V12_2_7','V12_2_8')
          Set-Content installer/Program.cs $program -Encoding utf8 -NoNewline
          $proj=Get-Content installer/SpankyhoInstaller.csproj -Raw
          $proj=$proj.Replace('V12_2_7','V12_2_8')
          Set-Content installer/SpankyhoInstaller.csproj $proj -Encoding utf8 -NoNewline
          $man=Get-Content installer/app.manifest -Raw
          $man=$man.Replace('12.2.7.0','12.2.8.0')
          Set-Content installer/app.manifest $man -Encoding utf8 -NoNewline

      - name: Build and smoke-test installer
        shell: pwsh
        run: |
          dotnet restore installer/SpankyhoInstaller.csproj
          dotnet build installer/SpankyhoInstaller.csproj -c Release -p:Platform=x64
          $exe=Get-ChildItem installer/bin/x64/Release/net48/*Setup.exe | Select-Object -First 1
          if(!$exe){throw 'Setup EXE missing'}
          & $exe.FullName --smoketest
          if($LASTEXITCODE -ne 0){throw "Installer smoke test failed: $LASTEXITCODE"}
          New-Item -ItemType Directory -Force artifacts/final|Out-Null
          Copy-Item $exe.FullName artifacts/final/Spankyho_Optimizer_V12_2_8_Setup.exe
          Get-FileHash artifacts/final/Spankyho_Optimizer_V12_2_8_Setup.exe -Algorithm SHA256 | Format-List | Out-File artifacts/final/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Spankyho_Optimizer_V12_2_8
          path: artifacts/final/*
          if-no-files-found: error
          retention-days: 30
