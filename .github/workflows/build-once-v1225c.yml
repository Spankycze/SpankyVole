name: One-shot Spankyho Optimizer V12.2.5 final

on:
  push:
    branches: [ spankyho-optimizer-v12-winui3 ]
    paths: [ '.github/workflows/build-once-v1225c.yml' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild source
        shell: pwsh
        run: |
          $parts=Get-ChildItem buildsrc/chunk*.txt | Sort-Object Name
          $b64=($parts|ForEach-Object{(Get-Content $_.FullName -Raw).Trim()}) -join ''
          [IO.File]::WriteAllBytes('source.zip',[Convert]::FromBase64String($b64))
          Expand-Archive source.zip . -Force

      - name: Fix XAML resources and make startup robust
        shell: pwsh
        run: |
          @'
          <Application
              x:Class="SpankyhoOptimizer.App"
              xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
              xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"
              xmlns:muxc="using:Microsoft.UI.Xaml.Controls">
              <Application.Resources>
                  <ResourceDictionary>
                      <ResourceDictionary.MergedDictionaries>
                          <muxc:XamlControlsResources />
                      </ResourceDictionary.MergedDictionaries>
                      <ResourceDictionary.ThemeDictionaries>
                          <ResourceDictionary x:Key="Light">
                              <SolidColorBrush x:Key="SpankyAccentBrush" Color="#5B5BD6"/>
                              <SolidColorBrush x:Key="SpankyAccentSoftBrush" Color="#145B5BD6"/>
                              <SolidColorBrush x:Key="SpankySuccessBrush" Color="#0F7B52"/>
                              <SolidColorBrush x:Key="SpankyWarningBrush" Color="#B35C00"/>
                              <SolidColorBrush x:Key="SpankyCardBrush" Color="#F7F7F9"/>
                              <SolidColorBrush x:Key="SpankyCardBorderBrush" Color="#18000000"/>
                          </ResourceDictionary>
                          <ResourceDictionary x:Key="Dark">
                              <SolidColorBrush x:Key="SpankyAccentBrush" Color="#8B8BFF"/>
                              <SolidColorBrush x:Key="SpankyAccentSoftBrush" Color="#248B8BFF"/>
                              <SolidColorBrush x:Key="SpankySuccessBrush" Color="#52C99A"/>
                              <SolidColorBrush x:Key="SpankyWarningBrush" Color="#FFB65A"/>
                              <SolidColorBrush x:Key="SpankyCardBrush" Color="#1C1D22"/>
                              <SolidColorBrush x:Key="SpankyCardBorderBrush" Color="#20FFFFFF"/>
                          </ResourceDictionary>
                          <ResourceDictionary x:Key="Default">
                              <SolidColorBrush x:Key="SpankyAccentBrush" Color="#5B5BD6"/>
                              <SolidColorBrush x:Key="SpankyAccentSoftBrush" Color="#145B5BD6"/>
                              <SolidColorBrush x:Key="SpankySuccessBrush" Color="#0F7B52"/>
                              <SolidColorBrush x:Key="SpankyWarningBrush" Color="#B35C00"/>
                              <SolidColorBrush x:Key="SpankyCardBrush" Color="#F7F7F9"/>
                              <SolidColorBrush x:Key="SpankyCardBorderBrush" Color="#18000000"/>
                          </ResourceDictionary>
                      </ResourceDictionary.ThemeDictionaries>
                      <Style x:Key="SectionCardStyle" TargetType="Border">
                          <Setter Property="Background" Value="{ThemeResource SpankyCardBrush}"/>
                          <Setter Property="BorderBrush" Value="{ThemeResource SpankyCardBorderBrush}"/>
                          <Setter Property="BorderThickness" Value="1"/>
                          <Setter Property="CornerRadius" Value="12"/>
                          <Setter Property="Padding" Value="16"/>
                          <Setter Property="Margin" Value="0,0,0,10"/>
                      </Style>
                      <Style x:Key="PillButtonStyle" TargetType="Button">
                          <Setter Property="CornerRadius" Value="10"/>
                          <Setter Property="Padding" Value="14,8"/>
                          <Setter Property="MinHeight" Value="36"/>
                      </Style>
                  </ResourceDictionary>
              </Application.Resources>
          </Application>
          '@ | Set-Content src/SpankyhoOptimizer/App.xaml -Encoding utf8 -NoNewline

          $mw='src/SpankyhoOptimizer/MainWindow.xaml'
          $x=Get-Content $mw -Raw
          $x=$x.Replace(' FontFamily="Segoe UI Variable Text"','')
          $x=$x.Replace('{ThemeResource CardBackgroundFillColorDefaultBrush}','{ThemeResource SpankyCardBrush}')
          Set-Content $mw $x -Encoding utf8 -NoNewline

          $mc='src/SpankyhoOptimizer/MainWindow.xaml.cs'
          $c=Get-Content $mc -Raw
          $c=$c.Replace('SystemBackdrop = new MicaBackdrop { Kind = MicaKind.BaseAlt };','try { SystemBackdrop = new MicaBackdrop(); } catch (Exception ex) { LogService.Error("Backdrop unavailable", ex); }')
          $c=$c.Replace('        ConfigureWindow();','        try { ConfigureWindow(); } catch (Exception ex) { LogService.Error("Window configuration failed", ex); }')
          Set-Content $mc $c -Encoding utf8 -NoNewline

          $p='src/SpankyhoOptimizer/SpankyhoOptimizer.csproj'
          $s=Get-Content $p -Raw
          $s=$s.Replace('Version="2.4.0"','Version="1.8.260804001"')
          $s=$s.Replace('<WindowsAppSDKSelfContained>false</WindowsAppSDKSelfContained>','<WindowsAppSDKSelfContained>true</WindowsAppSDKSelfContained>')
          $s=$s.Replace('<PublishReadyToRun>true</PublishReadyToRun>','<PublishReadyToRun>false</PublishReadyToRun>')
          $s=$s.Replace('<Version>12.2.0</Version>','<Version>12.2.5</Version>')
          Set-Content $p $s -Encoding utf8 -NoNewline

      - name: Generate icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force src/SpankyhoOptimizer/Assets|Out-Null
          $bmp=[System.Drawing.Bitmap]::new(256,256);$g=[System.Drawing.Graphics]::FromImage($bmp);$g.SmoothingMode=[System.Drawing.Drawing2D.SmoothingMode]::AntiAlias;$g.Clear([System.Drawing.Color]::Transparent)
          $b=[System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(255,91,91,214));$g.FillEllipse($b,8,8,240,240)
          $f=[System.Drawing.Font]::new('Segoe UI',132,[System.Drawing.FontStyle]::Bold,[System.Drawing.GraphicsUnit]::Pixel);$w=[System.Drawing.SolidBrush]::new([System.Drawing.Color]::White);$sf=[System.Drawing.StringFormat]::new();$sf.Alignment=[System.Drawing.StringAlignment]::Center;$sf.LineAlignment=[System.Drawing.StringAlignment]::Center;$g.DrawString('S',$f,$w,[System.Drawing.RectangleF]::new(0,0,256,248),$sf)
          $ico=[System.Drawing.Icon]::FromHandle($bmp.GetHicon());$fs=[IO.File]::Create('src/SpankyhoOptimizer/Assets/App.ico');$ico.Save($fs);$fs.Dispose();$ico.Dispose();$f.Dispose();$w.Dispose();$b.Dispose();$sf.Dispose();$g.Dispose();$bmp.Dispose()

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build WinUI app
        shell: pwsh
        run: |
          dotnet restore src/SpankyhoOptimizer/SpankyhoOptimizer.csproj -p:Platform=x64
          dotnet publish src/SpankyhoOptimizer/SpankyhoOptimizer.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -p:PublishReadyToRun=false -o artifacts/app
          if(!(Test-Path artifacts/app/SpankyhoOptimizer.exe)){throw 'Main app missing'}

      - name: Best-effort startup test
        shell: pwsh
        continue-on-error: true
        run: |
          $exe=(Resolve-Path 'artifacts/app/SpankyhoOptimizer.exe').Path
          $p=Start-Process $exe -PassThru -WorkingDirectory (Split-Path $exe)
          Start-Sleep 7
          $p.Refresh()
          if($p.HasExited){
            Write-Host "Runner GUI process exited: $($p.ExitCode)"
            $log=Join-Path $env:ProgramData 'SpankyhoOptimizerV12\optimizer.log'
            if(Test-Path $log){Get-Content $log -Tail 100}
          } else {Stop-Process -Id $p.Id -Force; Write-Host 'WinUI startup test passed.'}

      - name: Pack app
        shell: pwsh
        run: Compress-Archive -Path artifacts/app/* -DestinationPath artifacts/payload.zip -CompressionLevel Optimal -Force

      - name: Create readable installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer/Resources|Out-Null
          Copy-Item artifacts/payload.zip installer/Resources/payload.zip
          @'
          <Project Sdk="Microsoft.NET.Sdk.WindowsDesktop">
            <PropertyGroup><OutputType>WinExe</OutputType><TargetFramework>net48</TargetFramework><UseWPF>true</UseWPF><PlatformTarget>x64</PlatformTarget><Prefer32Bit>false</Prefer32Bit><AssemblyName>Spankyho_Optimizer_V12_2_5_Setup</AssemblyName><RootNamespace>SpankyhoInstaller</RootNamespace><ApplicationManifest>app.manifest</ApplicationManifest><DebugType>none</DebugType><DebugSymbols>false</DebugSymbols></PropertyGroup>
            <ItemGroup><EmbeddedResource Include="Resources\payload.zip" LogicalName="payload.zip"/><Reference Include="System.IO.Compression"/><Reference Include="System.IO.Compression.FileSystem"/><Reference Include="Microsoft.CSharp"/></ItemGroup>
          </Project>
          '@|Set-Content installer/SpankyhoInstaller.csproj -Encoding utf8 -NoNewline
          @'
          <?xml version="1.0" encoding="utf-8"?><assembly manifestVersion="1.0" xmlns="urn:schemas-microsoft-com:asm.v1"><assemblyIdentity version="12.2.5.0" name="SpankyhoOptimizer.Setup"/><trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"/></requestedPrivileges></security></trustInfo></assembly>
          '@|Set-Content installer/app.manifest -Encoding utf8 -NoNewline
          @'
          using Microsoft.Win32;using System;using System.Diagnostics;using System.IO;using System.IO.Compression;using System.Linq;using System.Reflection;using System.Threading.Tasks;using System.Windows;using System.Windows.Controls;using System.Windows.Media;
          namespace SpankyhoInstaller{
          internal static class Program{[STAThread]static int Main(string[]a){if(a.Contains("--smoketest")){using(var s=Assembly.GetExecutingAssembly().GetManifestResourceStream("payload.zip"))return s==null?3:0;}if(a.Contains("--uninstall"))return Uninstall();var app=new Application{ShutdownMode=ShutdownMode.OnMainWindowClose};app.Run(new InstallerWindow());return 0;}static int Uninstall(){try{var d=Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.ProgramFiles),"Spankyho Optimizer");try{foreach(var p in Process.GetProcessesByName("SpankyhoOptimizer"))p.Kill();}catch{}try{File.Delete(Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.DesktopDirectory),"Spankyho Optimizer.lnk"));}catch{}try{File.Delete(Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.CommonPrograms),"Spankyho Optimizer.lnk"));}catch{}try{Registry.LocalMachine.DeleteSubKeyTree(@"SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\SpankyhoOptimizer",false);}catch{}var c=Path.Combine(Path.GetTempPath(),"spankyho_remove.cmd");File.WriteAllText(c,"@echo off\r\ntimeout /t 2 /nobreak >nul\r\nrmdir /s /q \""+d+"\"\r\ndel /f /q \"%~f0\"\r\n");Process.Start(new ProcessStartInfo("cmd.exe","/c \""+c+"\""){CreateNoWindow=true,UseShellExecute=false});return 0;}catch{return 1;}}}
          internal sealed class InstallerWindow:Window{
          readonly SolidColorBrush A=new SolidColorBrush(Color.FromRgb(82,72,226)),T=new SolidColorBrush(Color.FromRgb(24,26,32)),S=new SolidColorBrush(Color.FromRgb(79,84,96));readonly ProgressBar P=new ProgressBar{Height=10,Minimum=0,Maximum=100,Margin=new Thickness(0,10,0,6)};readonly TextBlock St=new TextBlock{Text="Připraveno k instalaci",FontSize=15,FontWeight=FontWeights.SemiBold},Pc=new TextBlock{Text="0 %",FontSize=14,FontWeight=FontWeights.SemiBold,HorizontalAlignment=HorizontalAlignment.Right};readonly CheckBox D=new CheckBox{Content="Vytvořit zástupce na ploše",IsChecked=true,FontSize=15,Margin=new Thickness(0,6,0,10)},L=new CheckBox{Content="Po instalaci spustit aplikaci",IsChecked=true,FontSize=15};readonly Button I=new Button{Content="Nainstalovat",MinWidth=165,Height=48,FontSize=15,FontWeight=FontWeights.SemiBold,Foreground=Brushes.White,BorderThickness=new Thickness(0)},C=new Button{Content="Zrušit",MinWidth=110,Height=48,FontSize=15,Margin=new Thickness(10,0,0,0)};readonly string LD=Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.CommonApplicationData),"SpankyhoOptimizer");string LP=>Path.Combine(LD,"setup.log");
          public InstallerWindow(){Title="Spankyho Optimizer V12.2.5 Setup";Width=780;Height=610;MinWidth=700;MinHeight=550;WindowStartupLocation=WindowStartupLocation.CenterScreen;Background=new SolidColorBrush(Color.FromRgb(246,247,250));Foreground=T;FontFamily=new FontFamily("Segoe UI");I.Background=A;C.Background=Brushes.White;C.Foreground=T;C.BorderBrush=new SolidColorBrush(Color.FromRgb(205,209,218));P.Foreground=A;Content=Ui();I.Click+=async(_,__)=>await Go();C.Click+=(_,__)=>Close();}
          UIElement Ui(){var r=new Grid{Margin=new Thickness(40,32,40,30)};r.RowDefinitions.Add(new RowDefinition{Height=GridLength.Auto});r.RowDefinitions.Add(new RowDefinition());r.RowDefinitions.Add(new RowDefinition{Height=GridLength.Auto});var h=new Grid{Margin=new Thickness(0,0,0,26)};h.ColumnDefinitions.Add(new ColumnDefinition{Width=GridLength.Auto});h.ColumnDefinitions.Add(new ColumnDefinition());var lg=new Border{Width=58,Height=58,CornerRadius=new CornerRadius(15),Background=A};lg.Child=new TextBlock{Text="S",Foreground=Brushes.White,FontWeight=FontWeights.Bold,FontSize=31,HorizontalAlignment=HorizontalAlignment.Center,VerticalAlignment=VerticalAlignment.Center};h.Children.Add(lg);var hs=new StackPanel{Margin=new Thickness(17,1,0,0)};Grid.SetColumn(hs,1);hs.Children.Add(new TextBlock{Text="Instalace Spankyho Optimizer",FontSize=30,FontWeight=FontWeights.SemiBold,Foreground=T});hs.Children.Add(new TextBlock{Text="Jednoduchá a čitelná instalace pro Windows 11",FontSize=15,Foreground=S,Margin=new Thickness(0,5,0,0)});h.Children.Add(hs);r.Children.Add(h);var card=new Border{Background=Brushes.White,CornerRadius=new CornerRadius(18),BorderBrush=new SolidColorBrush(Color.FromRgb(220,223,230)),BorderThickness=new Thickness(1),Padding=new Thickness(26),Margin=new Thickness(0,0,0,22)};Grid.SetRow(card,1);var b=new StackPanel();b.Children.Add(new TextBlock{Text="Umístění instalace",FontSize=14,FontWeight=FontWeights.SemiBold,Foreground=T,Margin=new Thickness(0,0,0,9)});var pb=new Border{Background=new SolidColorBrush(Color.FromRgb(247,248,250)),CornerRadius=new CornerRadius(10),BorderBrush=new SolidColorBrush(Color.FromRgb(219,222,229)),BorderThickness=new Thickness(1),Padding=new Thickness(15,12,15,12),Margin=new Thickness(0,0,0,22)};pb.Child=new TextBlock{Text=@"C:\Program Files\Spankyho Optimizer",FontSize=14,Foreground=T};b.Children.Add(pb);b.Children.Add(new TextBlock{Text="Možnosti",FontSize=14,FontWeight=FontWeights.SemiBold,Foreground=T,Margin=new Thickness(0,0,0,8)});b.Children.Add(D);b.Children.Add(L);b.Children.Add(new Border{Height=1,Background=new SolidColorBrush(Color.FromRgb(232,234,239)),Margin=new Thickness(0,24,0,20)});b.Children.Add(new TextBlock{Text="Stav instalace",FontSize=14,FontWeight=FontWeights.SemiBold,Foreground=T,Margin=new Thickness(0,0,0,9)});var sg=new Grid();sg.ColumnDefinitions.Add(new ColumnDefinition());sg.ColumnDefinitions.Add(new ColumnDefinition{Width=GridLength.Auto});sg.Children.Add(St);Grid.SetColumn(Pc,1);sg.Children.Add(Pc);b.Children.Add(sg);b.Children.Add(P);b.Children.Add(new TextBlock{Text="Součástí instalace je .NET 10 i Windows App SDK. Po instalaci se nic dalšího nestahuje.",FontSize=13,Foreground=S,TextWrapping=TextWrapping.Wrap,Margin=new Thickness(0,15,0,0)});card.Child=b;r.Children.Add(card);var f=new Grid();f.ColumnDefinitions.Add(new ColumnDefinition());f.ColumnDefinitions.Add(new ColumnDefinition{Width=GridLength.Auto});Grid.SetRow(f,2);f.Children.Add(new TextBlock{Text=".NET 10  •  WinUI 3  •  x64",FontSize=13,Foreground=S,VerticalAlignment=VerticalAlignment.Center});var bs=new StackPanel{Orientation=Orientation.Horizontal};Grid.SetColumn(bs,1);bs.Children.Add(I);bs.Children.Add(C);f.Children.Add(bs);r.Children.Add(f);return r;}
          async Task Go(){I.IsEnabled=false;C.IsEnabled=false;try{Directory.CreateDirectory(LD);Log("Install start");Set(8,"Příprava instalačních souborů");await Task.Run(()=>Payload());Set(84,"Vytváření zástupců");Shortcuts();Set(100,"Instalace dokončena");if(L.IsChecked==true){var e=Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.ProgramFiles),"Spankyho Optimizer","SpankyhoOptimizer.exe");Process.Start(new ProcessStartInfo(e){UseShellExecute=true,WorkingDirectory=Path.GetDirectoryName(e)});}MessageBox.Show("Spankyho Optimizer byl úspěšně nainstalován.","Hotovo",MessageBoxButton.OK,MessageBoxImage.Information);Close();}catch(Exception ex){Log("FATAL "+ex);MessageBox.Show(ex.Message+"\n\nLog: "+LP,"Instalace selhala",MessageBoxButton.OK,MessageBoxImage.Error);I.IsEnabled=true;C.IsEnabled=true;}}
          void Set(double v,string s){Dispatcher.Invoke(()=>{P.Value=v;Pc.Text=((int)v)+" %";St.Text=s;});}void Payload(){var d=Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.ProgramFiles),"Spankyho Optimizer");try{foreach(var p in Process.GetProcessesByName("SpankyhoOptimizer"))p.Kill();}catch{}Directory.CreateDirectory(d);foreach(var f in Directory.GetFiles(d)){try{File.Delete(f);}catch{}}foreach(var x in Directory.GetDirectories(d)){try{Directory.Delete(x,true);}catch{}}using(var s=Assembly.GetExecutingAssembly().GetManifestResourceStream("payload.zip")??throw new InvalidOperationException("Chybí instalační data"))using(var z=new ZipArchive(s,ZipArchiveMode.Read)){int n=0,total=Math.Max(1,z.Entries.Count);foreach(var e in z.Entries){var dst=Path.GetFullPath(Path.Combine(d,e.FullName));if(!dst.StartsWith(Path.GetFullPath(d)+Path.DirectorySeparatorChar,StringComparison.OrdinalIgnoreCase))throw new InvalidDataException("Neplatná cesta v archivu");if(string.IsNullOrEmpty(e.Name))Directory.CreateDirectory(dst);else{Directory.CreateDirectory(Path.GetDirectoryName(dst));using(var a=e.Open())using(var o=new FileStream(dst,FileMode.Create,FileAccess.Write,FileShare.None))a.CopyTo(o);}n++;if(n%5==0)Set(8+72.0*n/total,"Kopírování souborů");}}File.Copy(Assembly.GetExecutingAssembly().Location,Path.Combine(d,"SpankyhoOptimizer.Uninstall.exe"),true);}void Shortcuts(){var d=Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.ProgramFiles),"Spankyho Optimizer"),e=Path.Combine(d,"SpankyhoOptimizer.exe");if(D.IsChecked==true)Sc(Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.DesktopDirectory),"Spankyho Optimizer.lnk"),e,d);Sc(Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.CommonPrograms),"Spankyho Optimizer.lnk"),e,d);using(var k=Registry.LocalMachine.CreateSubKey(@"SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\SpankyhoOptimizer")){k.SetValue("DisplayName","Spankyho Optimizer");k.SetValue("DisplayVersion","12.2.5");k.SetValue("Publisher","Spankyho");k.SetValue("InstallLocation",d);k.SetValue("DisplayIcon",e);k.SetValue("UninstallString","\""+Path.Combine(d,"SpankyhoOptimizer.Uninstall.exe")+"\" --uninstall");k.SetValue("NoModify",1,RegistryValueKind.DWord);k.SetValue("NoRepair",1,RegistryValueKind.DWord);}}void Sc(string p,string t,string w){try{dynamic sh=Activator.CreateInstance(Type.GetTypeFromProgID("WScript.Shell"));dynamic s=sh.CreateShortcut(p);s.TargetPath=t;s.WorkingDirectory=w;s.IconLocation=t+",0";s.Save();}catch(Exception ex){Log("Shortcut "+ex.Message);}}void Log(string s){try{Directory.CreateDirectory(LD);File.AppendAllText(LP,"["+DateTime.Now.ToString("yyyy-MM-dd HH:mm:ss.fff")+"] "+s+Environment.NewLine);}catch{}}
          }}
          '@|Set-Content installer/Program.cs -Encoding utf8 -NoNewline

      - name: Build installer
        shell: pwsh
        run: |
          dotnet restore installer/SpankyhoInstaller.csproj
          dotnet build installer/SpankyhoInstaller.csproj -c Release -p:Platform=x64
          $exe=(Resolve-Path 'installer/bin/x64/Release/net48/Spankyho_Optimizer_V12_2_5_Setup.exe').Path
          & $exe --smoketest
          if($LASTEXITCODE -ne 0){throw "Installer smoke test failed $LASTEXITCODE"}
          New-Item -ItemType Directory -Force artifacts/final|Out-Null
          Copy-Item $exe artifacts/final/Spankyho_Optimizer_V12_2_5_Setup.exe
          Get-FileHash artifacts/final/Spankyho_Optimizer_V12_2_5_Setup.exe -Algorithm SHA256|Format-List|Out-File artifacts/final/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Spankyho_Optimizer_V12_2_5_Setup
          path: |
            artifacts/final/Spankyho_Optimizer_V12_2_5_Setup.exe
            artifacts/final/SHA256.txt
          compression-level: 0
          retention-days: 1
