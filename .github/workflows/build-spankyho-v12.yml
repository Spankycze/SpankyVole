name: Build Spankyho Optimizer V12.2 WinUI
on:
  push:
    branches: [ spankyho-optimizer-v12-winui3 ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Materialize V12.2 source
        shell: pwsh
        env:
          SOURCE_ZIP_B64: [... ELLIPSIZATION ...]
        run: |
          [IO.File]::WriteAllBytes('source.zip',[Convert]::FromBase64String($env:SOURCE_ZIP_B64))
          Expand-Archive source.zip . -Force
      - name: Generate application icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 256,256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::Transparent)
          $brush = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(255,91,91,214))
          $g.FillEllipse($brush,8,8,240,240)
          $font = New-Object System.Drawing.Font 'Segoe UI',132,[System.Drawing.FontStyle]::Bold,[System.Drawing.GraphicsUnit]::Pixel
          $white = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::White)
          $sf = New-Object System.Drawing.StringFormat
          $sf.Alignment = [System.Drawing.StringAlignment]::Center
          $sf.LineAlignment = [System.Drawing.StringAlignment]::Center
          $g.DrawString('S',$font,$white,(New-Object System.Drawing.RectangleF(0,0,256,248)),$sf)
          $hicon=$bmp.GetHicon(); $ico=[System.Drawing.Icon]::FromHandle($hicon)
          New-Item -ItemType Directory -Force src/SpankyhoOptimizer/Assets,src/SpankyhoOptimizer.Setup/Assets,src/SpankyhoOptimizer.Bootstrap/Resources | Out-Null
          foreach($p in @('src/SpankyhoOptimizer/Assets/App.ico','src/SpankyhoOptimizer.Setup/Assets/App.ico','src/SpankyhoOptimizer.Bootstrap/App.ico')){ $fs=[IO.File]::Create($p); $ico.Save($fs); $fs.Dispose() }
          $ico.Dispose(); $g.Dispose(); $bmp.Dispose()
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build main app
        shell: pwsh
        run: |
          dotnet restore src/SpankyhoOptimizer/SpankyhoOptimizer.csproj -p:Platform=x64
          dotnet publish src/SpankyhoOptimizer/SpankyhoOptimizer.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -p:PublishReadyToRun=true -o artifacts/app
          Compress-Archive -Path artifacts/app/* -DestinationPath artifacts/payload.zip -CompressionLevel Optimal -Force
      - name: Build modern WinUI setup
        shell: pwsh
        run: |
          dotnet restore src/SpankyhoOptimizer.Setup/SpankyhoOptimizer.Setup.csproj -p:Platform=x64
          dotnet publish src/SpankyhoOptimizer.Setup/SpankyhoOptimizer.Setup.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -p:PublishReadyToRun=true -o artifacts/setup
          Copy-Item artifacts/payload.zip artifacts/setup/payload.zip
          Compress-Archive -Path artifacts/setup/* -DestinationPath src/SpankyhoOptimizer.Bootstrap/Resources/setup.zip -CompressionLevel Optimal -Force
      - name: Build single EXE bootstrap
        shell: pwsh
        run: |
          dotnet publish src/SpankyhoOptimizer.Bootstrap/SpankyhoOptimizer.Bootstrap.csproj -c Release -r win-x64 -p:PublishAot=true -o artifacts/final
          Get-FileHash artifacts/final/Spankyho_Optimizer_V12_2_WinUI_Setup.exe -Algorithm SHA256 | Format-List | Out-File artifacts/final/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Spankyho_Optimizer_V12_2_WinUI_Setup
          path: |
            artifacts/final/Spankyho_Optimizer_V12_2_WinUI_Setup.exe
            artifacts/final/SHA256.txt
          compression-level: 0
