name: Build Spankyho Optimizer V12.2 WinUI

on:
  push:
    branches: [ spankyho-optimizer-v12-winui3 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Materialize V12.2 source
        shell: pwsh
        run: |
          $parts = Get-ChildItem buildsrc/chunk*.txt | Sort-Object Name
          if ($parts.Count -ne 9) { throw "Expected 9 source chunks, got $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes('source.zip', $bytes)
          Expand-Archive source.zip . -Force
          Write-Host "Source archive: $($bytes.Length) bytes"

      - name: Pin stable Windows App SDK 1.8 line and normalize source
        shell: pwsh
        run: |
          Get-ChildItem src -Recurse -Filter *.csproj | ForEach-Object {
            $s = Get-Content $_.FullName -Raw
            $s = $s.Replace('Version="2.4.0"','Version="1.8.*"')
            Set-Content $_.FullName $s -NoNewline
          }
          Get-ChildItem src -Recurse -Include *.xaml,*.cs | ForEach-Object {
            $s = Get-Content $_.FullName -Raw
            $s = $s.Replace('Windows App SDK 2.4','Windows App SDK 1.8')
            $s = $s.Replace(' FontFamily="Segoe UI Variable Text"','')
            $s = $s.Replace('SystemBackdrop = new MicaBackdrop { Kind = MicaKind.BaseAlt };','SystemBackdrop = new MicaBackdrop();')
            Set-Content $_.FullName $s -NoNewline
          }

      - name: Generate application icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = [System.Drawing.Bitmap]::new(256,256)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::Transparent)
          $brush = [System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(255,91,91,214))
          $g.FillEllipse($brush,8,8,240,240)
          $font = [System.Drawing.Font]::new('Segoe UI',132,[System.Drawing.FontStyle]::Bold,[System.Drawing.GraphicsUnit]::Pixel)
          $white = [System.Drawing.SolidBrush]::new([System.Drawing.Color]::White)
          $sf = [System.Drawing.StringFormat]::new()
          $sf.Alignment = [System.Drawing.StringAlignment]::Center
          $sf.LineAlignment = [System.Drawing.StringAlignment]::Center
          $g.DrawString('S',$font,$white,[System.Drawing.RectangleF]::new(0,0,256,248),$sf)
          $hicon = $bmp.GetHicon()
          $ico = [System.Drawing.Icon]::FromHandle($hicon)
          New-Item -ItemType Directory -Force src/SpankyhoOptimizer/Assets,src/SpankyhoOptimizer.Setup/Assets,src/SpankyhoOptimizer.Bootstrap/Resources | Out-Null
          foreach($p in @('src/SpankyhoOptimizer/Assets/App.ico','src/SpankyhoOptimizer.Setup/Assets/App.ico','src/SpankyhoOptimizer.Bootstrap/App.ico')) {
            $fs=[IO.File]::Create($p); $ico.Save($fs); $fs.Dispose()
          }
          $ico.Dispose(); $font.Dispose(); $white.Dispose(); $brush.Dispose(); $sf.Dispose(); $g.Dispose(); $bmp.Dispose()

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build main WinUI app
        shell: pwsh
        run: |
          dotnet restore src/SpankyhoOptimizer/SpankyhoOptimizer.csproj -p:Platform=x64
          dotnet publish src/SpankyhoOptimizer/SpankyhoOptimizer.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -p:PublishReadyToRun=true -o artifacts/app
          if (!(Test-Path artifacts/app)) { throw "Main app publish failed" }
          Compress-Archive -Path artifacts/app/* -DestinationPath artifacts/payload.zip -CompressionLevel Optimal -Force

      - name: Build modern WinUI setup
        shell: pwsh
        run: |
          dotnet restore src/SpankyhoOptimizer.Setup/SpankyhoOptimizer.Setup.csproj -p:Platform=x64
          dotnet publish src/SpankyhoOptimizer.Setup/SpankyhoOptimizer.Setup.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -p:PublishReadyToRun=true -o artifacts/setup
          if (!(Test-Path artifacts/setup)) { throw "Setup publish failed" }
          Copy-Item artifacts/payload.zip artifacts/setup/payload.zip
          Compress-Archive -Path artifacts/setup/* -DestinationPath src/SpankyhoOptimizer.Bootstrap/Resources/setup.zip -CompressionLevel Optimal -Force

      - name: Build single EXE bootstrap
        shell: pwsh
        run: |
          dotnet publish src/SpankyhoOptimizer.Bootstrap/SpankyhoOptimizer.Bootstrap.csproj -c Release -r win-x64 -p:PublishAot=true -o artifacts/final
          $exe = 'artifacts/final/Spankyho_Optimizer_V12_2_WinUI_Setup.exe'
          if (!(Test-Path $exe)) { throw "Final setup EXE missing" }
          Get-FileHash $exe -Algorithm SHA256 | Format-List | Out-File artifacts/final/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Spankyho_Optimizer_V12_2_WinUI_Setup
          path: |
            artifacts/final/Spankyho_Optimizer_V12_2_WinUI_Setup.exe
            artifacts/final/SHA256.txt
          compression-level: 0
