name: Build Spankyho Optimizer V12.2.2 Compact WinUI

on:
  push:
    branches: [ spankyho-optimizer-v12-winui3 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Materialize source
        shell: pwsh
        run: |
          $parts = Get-ChildItem buildsrc/chunk*.txt | Sort-Object Name
          if ($parts.Count -ne 9) { throw "Expected 9 source chunks, got $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('source.zip',[Convert]::FromBase64String($b64))
          Expand-Archive source.zip . -Force

      - name: Normalize WinUI projects
        shell: pwsh
        run: |
          Get-ChildItem src -Recurse -Filter *.csproj | ForEach-Object {
            $s = Get-Content $_.FullName -Raw
            $s = $s.Replace('Version="2.4.0"','Version="1.8.260804001"')
            $s = $s.Replace('<WindowsAppSDKSelfContained>true</WindowsAppSDKSelfContained>','<WindowsAppSDKSelfContained>false</WindowsAppSDKSelfContained>')
            $s = $s.Replace('<PublishReadyToRun>true</PublishReadyToRun>','<PublishReadyToRun>false</PublishReadyToRun>')
            Set-Content $_.FullName $s -NoNewline
          }
          Get-ChildItem src -Recurse -Include *.xaml,*.cs | ForEach-Object {
            $s = Get-Content $_.FullName -Raw
            $s = $s.Replace('Windows App SDK 2.4','Windows App SDK 1.8.11')
            $s = $s.Replace(' FontFamily="Segoe UI Variable Text"','')
            $s = $s.Replace('SystemBackdrop = new MicaBackdrop { Kind = MicaKind.BaseAlt };','SystemBackdrop = new MicaBackdrop();')
            $s = $s.Replace('SystemBackdrop=new MicaBackdrop{Kind=MicaKind.BaseAlt};','SystemBackdrop=new MicaBackdrop();')
            $s = $s.Replace('var id=Win32Interop.GetWindowIdFromWindow','var id=Microsoft.UI.Win32Interop.GetWindowIdFromWindow')
            Set-Content $_.FullName $s -NoNewline
          }

      - name: Replace bootstrap with compact reliable launcher
        shell: pwsh
        run: |
          @'
          using System.Diagnostics;
          using System.IO.Compression;
          using System.Net.Http;
          using System.Reflection;
          using System.Runtime.InteropServices;

          internal static class Program
          {
              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              private static extern int MessageBoxW(nint hWnd, string text, string caption, uint type);

              private static readonly string Root = Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.CommonApplicationData), "SpankyhoOptimizer");
              private static readonly string LogPath = Path.Combine(Root, "setup-bootstrap.log");
              private const string DotNetUrl = "https://builds.dotnet.microsoft.com/dotnet/Runtime/10.0.10/dotnet-runtime-10.0.10-win-x64.exe";
              private const string WinAppUrl = "https://aka.ms/windowsappsdk/1.8/1.8.260804001/windowsappruntimeinstall-x64.exe";

              [STAThread]
              private static int Main(string[] args)
              {
                  try
                  {
                      Directory.CreateDirectory(Root);
                      bool extractOnly = args.Length > 0 && args[0].Equals("--extract-only", StringComparison.OrdinalIgnoreCase);
                      Log("Bootstrap start; extractOnly=" + extractOnly);

                      if (!extractOnly)
                          EnsurePrerequisites();

                      var setupDir = Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData), "SpankyhoOptimizer", "Installer", "12.2.2");
                      try { if (Directory.Exists(setupDir)) Directory.Delete(setupDir, true); } catch { }
                      Directory.CreateDirectory(setupDir);

                      using (var s = Assembly.GetExecutingAssembly().GetManifestResourceStream("setup.zip") ?? throw new InvalidOperationException("setup.zip resource missing"))
                      using (var z = new ZipArchive(s, ZipArchiveMode.Read))
                          z.ExtractToDirectory(setupDir, true);

                      var setupExe = Path.Combine(setupDir, "SpankyhoOptimizer.Setup.exe");
                      if (!File.Exists(setupExe)) throw new FileNotFoundException("Setup executable missing", setupExe);
                      if (extractOnly) return 0;

                      Log("Launching WinUI setup: " + setupExe);
                      var p = Process.Start(new ProcessStartInfo(setupExe)
                      {
                          UseShellExecute = true,
                          WorkingDirectory = setupDir,
                          Verb = "runas"
                      }) ?? throw new InvalidOperationException("Setup process could not be started");

                      // Keep extracted WinUI files in a stable folder. The old temp bootstrap deleted them too early after ShellExecute/UAC.
                      Log("Setup launched, pid=" + p.Id);
                      return 0;
                  }
                  catch (Exception ex)
                  {
                      try { Log("FATAL: " + ex); } catch { }
                      MessageBoxW(0, "Instalátor se nepodařilo spustit.\n\n" + ex.Message + "\n\nPodrobnosti: " + LogPath, "Spankyho Optimizer Setup", 0x10);
                      return 1;
                  }
              }

              private static void EnsurePrerequisites()
              {
                  var prereq = Path.Combine(Root, "Prerequisites");
                  Directory.CreateDirectory(prereq);

                  if (!HasDotNet10())
                  {
                      var file = Path.Combine(prereq, "dotnet-runtime-10.exe");
                      Log(".NET 10 missing; downloading official Microsoft runtime");
                      Download(DotNetUrl, file);
                      RunInstaller(file, "/install /quiet /norestart", 0, 3010);
                  }
                  else Log(".NET 10 runtime present");

                  var marker = Path.Combine(prereq, "windows-app-runtime-1.8.11.ok");
                  if (!File.Exists(marker))
                  {
                      var file = Path.Combine(prereq, "windowsappruntime-1.8.11.exe");
                      Log("Ensuring Windows App Runtime 1.8.11 from Microsoft");
                      Download(WinAppUrl, file);
                      RunInstaller(file, "--quiet", 0, 3010);
                      File.WriteAllText(marker, DateTime.UtcNow.ToString("O"));
                  }
                  else Log("Windows App Runtime marker present");
              }

              private static bool HasDotNet10()
              {
                  try
                  {
                      var dir = Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.ProgramFiles), "dotnet", "shared", "Microsoft.NETCore.App");
                      return Directory.Exists(dir) && Directory.EnumerateDirectories(dir).Select(Path.GetFileName).Any(v => v is not null && v.StartsWith("10.", StringComparison.Ordinal));
                  }
                  catch { return false; }
              }

              private static void Download(string url, string target)
              {
                  try { if (File.Exists(target)) File.Delete(target); } catch { }
                  using var http = new HttpClient { Timeout = TimeSpan.FromMinutes(10) };
                  using var response = http.GetAsync(url, HttpCompletionOption.ResponseHeadersRead).GetAwaiter().GetResult();
                  response.EnsureSuccessStatusCode();
                  using var input = response.Content.ReadAsStream();
                  using var output = File.Create(target);
                  input.CopyTo(output);
                  Log("Downloaded " + Path.GetFileName(target) + " bytes=" + output.Length);
              }

              private static void RunInstaller(string file, string arguments, params int[] okCodes)
              {
                  var p = Process.Start(new ProcessStartInfo(file)
                  {
                      UseShellExecute = false,
                      CreateNoWindow = true,
                      WorkingDirectory = Path.GetDirectoryName(file)!,
                      Arguments = arguments
                  }) ?? throw new InvalidOperationException("Could not start prerequisite installer");
                  p.WaitForExit();
                  int code = p.ExitCode;
                  p.Dispose();
                  if (!okCodes.Contains(code)) throw new InvalidOperationException(Path.GetFileName(file) + " failed with exit code " + code);
                  try { File.Delete(file); } catch { }
              }

              private static void Log(string text) => File.AppendAllText(LogPath, $"[{DateTime.Now:yyyy-MM-dd HH:mm:ss.fff}] {text}{Environment.NewLine}");
          }
          '@ | Set-Content src/SpankyhoOptimizer.Bootstrap/Program.cs -NoNewline

          @'
          <?xml version="1.0" encoding="utf-8"?>
          <assembly manifestVersion="1.0" xmlns="urn:schemas-microsoft-com:asm.v1">
            <assemblyIdentity version="12.2.2.0" name="SpankyhoOptimizer.Bootstrap"/>
            <trustInfo xmlns="urn:schemas-microsoft-com:asm.v3">
              <security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false" /></requestedPrivileges></security>
            </trustInfo>
          </assembly>
          '@ | Set-Content src/SpankyhoOptimizer.Bootstrap/app.manifest -NoNewline

          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net10.0-windows</TargetFramework>
              <RuntimeIdentifier>win-x64</RuntimeIdentifier>
              <PublishAot>true</PublishAot>
              <SelfContained>true</SelfContained>
              <InvariantGlobalization>true</InvariantGlobalization>
              <AssemblyName>Spankyho_Optimizer_V12_2_2_Compact_Setup</AssemblyName>
              <ApplicationIcon>App.ico</ApplicationIcon>
              <ApplicationManifest>app.manifest</ApplicationManifest>
              <DebugType>none</DebugType>
              <DebugSymbols>false</DebugSymbols>
              <StripSymbols>true</StripSymbols>
            </PropertyGroup>
            <ItemGroup>
              <EmbeddedResource Include="Resources\setup.zip" LogicalName="setup.zip" />
            </ItemGroup>
          </Project>
          '@ | Set-Content src/SpankyhoOptimizer.Bootstrap/SpankyhoOptimizer.Bootstrap.csproj -NoNewline

      - name: Generate icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = [System.Drawing.Bitmap]::new(256,256); $g = [System.Drawing.Graphics]::FromImage($bmp); $g.SmoothingMode=[System.Drawing.Drawing2D.SmoothingMode]::AntiAlias; $g.Clear([System.Drawing.Color]::Transparent)
          $purple=[System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(255,91,91,214)); $g.FillEllipse($purple,8,8,240,240)
          $font=[System.Drawing.Font]::new('Segoe UI',132,[System.Drawing.FontStyle]::Bold,[System.Drawing.GraphicsUnit]::Pixel); $white=[System.Drawing.SolidBrush]::new([System.Drawing.Color]::White); $sf=[System.Drawing.StringFormat]::new(); $sf.Alignment='Center'; $sf.LineAlignment='Center'; $g.DrawString('S',$font,$white,[System.Drawing.RectangleF]::new(0,0,256,248),$sf)
          $ico=[System.Drawing.Icon]::FromHandle($bmp.GetHicon()); New-Item -ItemType Directory -Force src/SpankyhoOptimizer/Assets,src/SpankyhoOptimizer.Setup/Assets,src/SpankyhoOptimizer.Bootstrap/Resources | Out-Null
          foreach($p in @('src/SpankyhoOptimizer/Assets/App.ico','src/SpankyhoOptimizer.Setup/Assets/App.ico','src/SpankyhoOptimizer.Bootstrap/App.ico')) { $fs=[IO.File]::Create($p); $ico.Save($fs); $fs.Dispose() }
          $ico.Dispose(); $font.Dispose(); $white.Dispose(); $purple.Dispose(); $sf.Dispose(); $g.Dispose(); $bmp.Dispose()

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build compact main app
        shell: pwsh
        run: |
          dotnet restore src/SpankyhoOptimizer/SpankyhoOptimizer.csproj -p:Platform=x64
          dotnet publish src/SpankyhoOptimizer/SpankyhoOptimizer.csproj -c Release -r win-x64 --self-contained false -p:Platform=x64 -p:WindowsAppSDKSelfContained=false -p:PublishReadyToRun=false -o artifacts/app
          if (!(Test-Path artifacts/app/SpankyhoOptimizer.exe)) { throw "Main app publish failed" }
          Compress-Archive artifacts/app/* artifacts/payload.zip -CompressionLevel Optimal -Force

      - name: Build compact WinUI setup
        shell: pwsh
        run: |
          dotnet restore src/SpankyhoOptimizer.Setup/SpankyhoOptimizer.Setup.csproj -p:Platform=x64
          dotnet publish src/SpankyhoOptimizer.Setup/SpankyhoOptimizer.Setup.csproj -c Release -r win-x64 --self-contained false -p:Platform=x64 -p:WindowsAppSDKSelfContained=false -p:PublishReadyToRun=false -o artifacts/setup
          if (!(Test-Path artifacts/setup/SpankyhoOptimizer.Setup.exe)) { throw "Setup publish failed" }
          Copy-Item artifacts/payload.zip artifacts/setup/payload.zip
          Compress-Archive artifacts/setup/* src/SpankyhoOptimizer.Bootstrap/Resources/setup.zip -CompressionLevel Optimal -Force
          Write-Host "SETUP ZIP BYTES: $((Get-Item src/SpankyhoOptimizer.Bootstrap/Resources/setup.zip).Length)"

      - name: Build and smoke-test final EXE
        shell: pwsh
        run: |
          dotnet publish src/SpankyhoOptimizer.Bootstrap/SpankyhoOptimizer.Bootstrap.csproj -c Release -r win-x64 -p:PublishAot=true -o artifacts/final
          $exe='artifacts/final/Spankyho_Optimizer_V12_2_2_Compact_Setup.exe'
          if (!(Test-Path $exe)) { throw "Final setup EXE missing" }
          Write-Host "FINAL EXE BYTES: $((Get-Item $exe).Length)"
          Get-FileHash $exe -Algorithm SHA256 | Format-List | Tee-Object artifacts/final/SHA256.txt
          & $exe --extract-only
          if ($LASTEXITCODE -ne 0) { throw "Bootstrap extraction smoke test failed: $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: Spankyho_Optimizer_V12_2_2_Compact_Setup
          path: |
            artifacts/final/Spankyho_Optimizer_V12_2_2_Compact_Setup.exe
            artifacts/final/SHA256.txt
          compression-level: 0
